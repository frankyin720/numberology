@if (open) {
  <div class="profile-overlay" role="dialog" aria-modal="true" aria-labelledby="profile-dialog-title">
    <div class="profile-backdrop" (click)="onBackdropClick()"></div>
    <div class="profile-panel" (click)="$event.stopPropagation()">
      @if (!required) {
        <button type="button" class="profile-close" title="關閉" (click)="close()">×</button>
      }
      <app-profile-form
        [hint]="hint"
        [submitLabel]="submitLabel"
        (saved)="onSaved()"
      />
    </div>
  </div>
}
